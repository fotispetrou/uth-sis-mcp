[project]
name = "uth-sis-mcp"
version = "0.1.0"
description = "MCP server για την Ηλεκτρονική Γραμματεία (SIS-Web) του Πανεπιστημίου Θεσσαλίας: βαθμοί, πρόοδος, δηλώσεις μαθημάτων"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Fotis Petrou" }]
dependencies = [
    "mcp>=2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "keyring>=24",
]

[project.urls]
Repository = "https://github.com/fotispetrou/uth-sis-mcp"

[project.scripts]
uth-sis-mcp = "uth_sis_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uth_sis_mcp"]

[dependency-groups]
dev = ["pytest>=8"]
